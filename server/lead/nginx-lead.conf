# Вставляется в server { server_name lemmus.studio; ... } в /etc/nginx/sites-available/lemmus.studio.
# Зона ограничения частоты объявлена в /etc/nginx/conf.d/lemnity-lead-zone.conf:
#   limit_req_zone $binary_remote_addr zone=lead:10m rate=6r/m;
location /api/lead {
    limit_req zone=lead burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}

# Город посетителя для ссылки «Сайты в …» (тот же сервис, без ограничения частоты заявок).
location = /api/geo {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 5s;
    access_log off;
}
